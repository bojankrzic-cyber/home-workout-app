<!-- Supabase Auth → Email Templates → "Magic Link" (and "Confirm signup"). Link + code: the code signs in on TV / home-screen app. -->
<h2>Sign in to Formshaper</h2>
<p>Tap the button on the device where you use the app:</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#33ab59;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600">Sign in</a></p>
<p>Or type this code in the app:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p style="color:#666">The code is valid for 15 minutes. If you didn’t ask for it, ignore this e-mail.</p>
<p style="color:#666">Nature’s Finest · Formshaper</p>
