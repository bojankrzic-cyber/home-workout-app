# Supabase CLI project settings (deploy: supabase link --project-ref <ref> && supabase db push && supabase functions deploy)
[auth]
site_url = "https://app.naturesfinest.eu"
additional_redirect_urls = ["https://bojankrzic-cyber.github.io/home-workout-app/"]
enable_signup = true
# reminders before an account: an anonymous user holds the push subscription and links an e-mail / Google later
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 900

[functions.shop-order]
verify_jwt = false

[functions.klaviyo-sync]
verify_jwt = false

[functions.device-ingest]
verify_jwt = false

[functions.reminders]
verify_jwt = false
